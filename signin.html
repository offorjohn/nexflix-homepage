
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" dir="rtl" lang="ar">
<head>
    <title>Fasel+</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow" />
	<meta http-equiv='cache-control' content='no-cache'>
    <meta http-equiv='expires' content='0'>
    <meta http-equiv='pragma' content='no-cache'>
    <link rel="shortcut icon" type="image/x-icon" href="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/imgs/icons/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;500;700&family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="wp-content/themes/Faselplus/Assets/css/bootstrap-rtl.css">
    <link rel="stylesheet" type="text/css" href="wp-content/themes/Faselplus/Assets/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/css/nice-select.css">
    <link rel="stylesheet" type="text/css" href="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/css/owl.carousel.css">
    <link rel="stylesheet" type="text/css" href="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/css/owl.theme.default.min.css">
    <link rel="stylesheet" type="text/css" href="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/css/style.css?v=1.0">
    <link rel="stylesheet" type="text/css" href="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/css/style-responsive.css?v=1.0">
    <script type="text/javascript" src="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/js/jquery-3.6.1.min.js"></script>
    <script type="text/javascript" src="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/js/jquery.cookie.min.js"></script>
    <script type="text/javascript" src="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/js/jquery.nice-select.min.js"></script>
    <script type="text/javascript" src="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/js/swiper-bundle.min.js"></script>
    <script type="text/javascript" src="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/js/owl.carousel.js"></script>
    <script type="text/javascript" src="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/js/bootstrap.min.js"></script>
	<script type="text/javascript" src="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/js/app.js?v=2.2"></script>
	<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top" id="nav">
        <div class="container-fluid">
            <a class="navbar-brand" href="https://www.faselplus.com/"> <img src="wp-content/themes/Faselplus/Assets/imgs/icons/logo.svg" alt="logo"> </a>
        </div>
    </nav>
    <div class="register-log-area">
        <div class="container-fluid">
            <div class="row justify-content-center top-sec-padd mn-log-frm-sec">
                <div class="col-md-4 col-xs-12">
                    <div class="reg-log-form">
                        <div class="reg-log-form-title">
                            <h3> تسجيل الدخول </h3>
                        </div>
                        <form class="main-form row signin-form" novalidate>
                            <div class="form-group col-12 icon-style">
                                <label> البريد الإلكتروني </label>
                                <div class="icon-input">
                                    <img src="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/imgs/icons/user.svg" class="icon-style-chi">
                                    <input class="form-control" type="email" name="email" placeholder="example@example.com" required>
                                    <div class="invalid-feedback">من فضلك أدخل بريد إلكتروني صحيح! </div>
                                </div>
                            </div>
                            <div class="form-group col-12 icon-style">
                                <label> كلمة المرور </label>
                                <div class="icon-input">
                                    <img src="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/imgs/icons/key_pass.svg" class="icon-style-chi">
                                    <input class="form-control" type="password" name="password" autocomplete="false" minlength="8" placeholder="***********" required>
                                    <div class="input-group-append toggle-password">
                                        <img src="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/imgs/icons/eye_hide.svg" class="ps-btn ps-btn-hide">
                                        <img src="https://www.faselplus.com/wp-content/themes/Faselplus/Assets/imgs/icons/eye_show.svg" class="ps-btn ps-btn-show">
                                    </div>
                                    <div class="invalid-feedback">يجب أن لا تكون كلمة المرور أقل من 8 رموز!</div>
                                </div>
                            </div>
							<div class="form-group col-12">
							    <div class="g-recaptcha" data-sitekey="6LcDqYAjAAAAAP4q59B9fH1CnzEdC_Tt0GylEOaQ"></div>
								<div class="invalid-feedback recaptcha">reCAPTCHA غير صحيحة</div>
							</div>
                            <div class="forgetPass">
                                <a href="https://www.faselplus.com/forget-password"> نسيت كلمة المرور؟ </a>
                            </div>
                            <div class="form-group col-12 form-btn">
                                <button class="btn main-btn primary-btn"> تسجيل الدخول </button>
                                <div class="danger"></div>
                            </div>
                        </form>
                        <div class="hav-acc">
                            <h5> ليس لديك حساب؟ <a href="signup.html"> إنشاء حساب </a> </h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
